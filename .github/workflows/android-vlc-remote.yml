name: Validate VLC Remote Modern

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlc-remote-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile, unit test and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: VLC-Remote-Modern-1.0-rc4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: VLC-Remote-Modern-rc4-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
